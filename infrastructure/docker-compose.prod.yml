services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: unidemic-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: UniDemic
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.unidemic.app}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-unidemic}
      DB_USERNAME: ${DB_USERNAME:-unidemic}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unidemic-network

  db:
    image: postgres:16-alpine
    container_name: unidemic-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-unidemic}
      POSTGRES_USER: ${DB_USERNAME:-unidemic}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - unidemic_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-unidemic} -d ${DB_DATABASE:-unidemic}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unidemic-network

  redis:
    image: redis:7-alpine
    container_name: unidemic-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - unidemic_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unidemic-network

networks:
  unidemic-network:
    driver: bridge

volumes:
  unidemic_prod_pgdata:
    driver: local
  unidemic_prod_redisdata:
    driver: local
